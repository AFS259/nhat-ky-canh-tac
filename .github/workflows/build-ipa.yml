name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Xcode version
        run: xcodebuild -version

      - name: Build unsigned archive
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project NhatKyCanhTacAFS.xcodeproj \
            -scheme NhatKyCanhTacAFS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/AFS.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            archive 2>&1 | tee build.log

      - name: Package unsigned IPA
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="build/AFS.xcarchive/Products/Applications/NhatKyCanhTacAFS.app"
          test -d "$APP_PATH"
          rm -rf build/Payload build/export
          mkdir -p build/Payload build/export
          cp -R "$APP_PATH" build/Payload/
          (cd build && zip -qry export/NhatKyCanhTacAFS.ipa Payload)
          ls -lh build/export/

      - name: Upload unsigned IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NhatKyCanhTacAFS-unsigned.ipa
          path: build/export/NhatKyCanhTacAFS.ipa
          if-no-files-found: error

      - name: Publish build log to repo (on failure)
        if: failure()
        shell: bash
        run: |
          set +e
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          cp build.log build.log.txt 2>/dev/null || true
          git add -f build.log.txt
          git commit -m "ci: build log [skip ci]" || true
          git push || true
